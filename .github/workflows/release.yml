name: Release

# Builds a self-contained EmuSync.exe and publishes it as a GitHub Release
# whenever a tag like v1.0.0 is pushed. Can also be started by hand from the
# Actions tab (a tag is still required for the release to be named).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The OAuth client id/secret are never committed: they are stored as
      # repository secrets and written into BuiltInCredentials.cs at build time.
      - name: Inject Google OAuth credentials
        shell: pwsh
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if (-not $env:GOOGLE_CLIENT_ID -or -not $env:GOOGLE_CLIENT_SECRET) {
            throw "Missing GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET repository secrets."
          }
          $path = 'EmuSync.Core/BuiltInCredentials.cs'
          $text = Get-Content $path -Raw
          $text = $text -replace 'ClientId = ""', ('ClientId = "' + $env:GOOGLE_CLIENT_ID + '"')
          $text = $text -replace 'ClientSecret = ""', ('ClientSecret = "' + $env:GOOGLE_CLIENT_SECRET + '"')
          Set-Content $path $text -NoNewline
          # Never print the file: it now contains the secret.
          Write-Host "Credentials injected."

      - name: Publish (self-contained, single file, win-x64)
        run: >
          dotnet publish EmuSync/EmuSync.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if (-not $version) { $version = "dev" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item publish/EmuSync.exe "artifacts/EmuSync.exe"
          Compress-Archive -Path publish/EmuSync.exe, README.md, README.it.md `
                           -DestinationPath "artifacts/EmuSync-$version-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: EmuSync ${{ github.ref_name }}
          draft: true          # review it, then press "Publish release"
          generate_release_notes: true
          files: |
            artifacts/EmuSync.exe
            artifacts/EmuSync-*.zip
