name: Release

# Builds a self-contained EmuSync.exe and publishes it as a GitHub Release
# whenever a tag like v1.0.0 is pushed. Can also be started by hand from the
# Actions tab (a tag is still required for the release to be named).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The OAuth client id/secret are never committed: they are stored as
      # repository secrets and written into BuiltInCredentials.cs at build time.
      - name: Inject Google OAuth credentials
        shell: pwsh
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if (-not $env:GOOGLE_CLIENT_ID -or -not $env:GOOGLE_CLIENT_SECRET) {
            throw "Missing GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET repository secrets."
          }
          $path = 'EmuSync.Core/BuiltInCredentials.cs'
          $text = Get-Content $path -Raw
          $text = $text -replace 'ClientId = ""', ('ClientId = "' + $env:GOOGLE_CLIENT_ID + '"')
          $text = $text -replace 'ClientSecret = ""', ('ClientSecret = "' + $env:GOOGLE_CLIENT_SECRET + '"')
          Set-Content $path $text -NoNewline
          # Never print the file: it now contains the secret.
          Write-Host "Credentials injected."

      # The Firebase settings live in emusync-firebase.json, which is git-ignored,
      # so a released build has to carry them inside the executable instead.
      # The API key is not a secret (every Firebase web app ships it in the clear);
      # it is kept as a repository secret only so a fork points at its own project.
      - name: Inject Firebase settings
        shell: pwsh
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if (-not $env:FIREBASE_API_KEY) {
            throw "Missing FIREBASE_API_KEY repository secret: the app would start unconfigured."
          }
          $path = 'EmuSync.Core/FirebaseOptions.cs'
          $text = Get-Content $path -Raw
          $text = $text -replace 'EmbeddedApiKey = ""', ('EmbeddedApiKey = "' + $env:FIREBASE_API_KEY + '"')
          if ($env:FIREBASE_PROJECT_ID) {
            $text = $text -replace 'EmbeddedProjectId = "[^"]*"',
                                   ('EmbeddedProjectId = "' + $env:FIREBASE_PROJECT_ID + '"')
          }
          Set-Content $path $text -NoNewline
          Write-Host "Firebase settings injected."

      - name: Publish (self-contained, single file, win-x64)
        shell: pwsh
        run: |
          # Tags look like v1.2.3; the assembly version wants 1.2.3.
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+(\.\d+){0,3}$') { $version = '1.0.0' }
          dotnet publish EmuSync/EmuSync.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:Version=$version `
            -o publish

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if (-not $version) { $version = "dev" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item publish/EmuSync.exe "artifacts/EmuSync.exe"
          Compress-Archive -Path publish/EmuSync.exe, README.md, README.it.md `
                           -DestinationPath "artifacts/EmuSync-$version-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: EmuSync ${{ github.ref_name }}
          draft: true          # review it, then press "Publish release"
          generate_release_notes: true
          files: |
            artifacts/EmuSync.exe
            artifacts/EmuSync-*.zip
